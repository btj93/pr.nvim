name: Bug report
description: Report a problem with pr.nvim
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill in as much as you
        can — the version, provider, picker, and `:checkhealth pr` output are the
        fastest path to a diagnosis.

  - type: textarea
    id: nvim-version
    attributes:
      label: Neovim version
      description: Output of `nvim --version` (pr.nvim requires 0.10+).
      placeholder: |
        NVIM v0.11.0
        ...
      render: text
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: pr.nvim version / commit
      description: The installed tag or commit SHA (`git -C <plugin dir> rev-parse HEAD`).
      placeholder: "abc1234 (or v0.1.0)"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which `provider = ...` are you using?
      options:
        - github
        - gitlab
        - bitbucket
    validations:
      required: true

  - type: dropdown
    id: picker
    attributes:
      label: Picker
      description: Which `picker = ...` are you using?
      options:
        - snacks
        - telescope
        - fzf
    validations:
      required: true

  - type: textarea
    id: checkhealth
    attributes:
      label: "`:checkhealth pr` output"
      description: Run `:checkhealth pr` and paste the full output.
      render: text
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        Exact steps to reproduce, ideally from a minimal config. Include the
        command/keymap you ran and any relevant `:messages` output.
      placeholder: |
        1. Open a file in a checked-out PR branch
        2. Run :PRComment on the last line
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, including any error text.
    validations:
      required: true
